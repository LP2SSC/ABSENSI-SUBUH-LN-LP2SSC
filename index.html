<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABSENSI SHALAT SUBUH — PROGRAM LUAR NEGERI — LP2SSC</title>
  <style>
    *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb;margin:0;padding:0}
    html,body,#root{min-height:100%;height:100%}
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    button{cursor:pointer;font-family:inherit}
    input:focus{outline:none;box-shadow:none}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scaleIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
    .history-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:3px;border:1px solid rgba(0,0,0,.12);vertical-align:middle}
    .history-dots{display:flex;align-items:center;gap:0;margin-top:6px;flex-wrap:wrap}
    .history-dots-label{font-size:9px;font-weight:700;letter-spacing:.06em;color:rgba(0,0,0,.3);margin-right:6px}
  </style>

<style id="skin-engine-css">
/* ============================================================
   SKIN ENGINE — LAPISAN TEMA TAMPILAN
   Dipilih admin, otomatis diikuti tampilan siswa.
   Tema "default" = tampilan asli (tanpa perubahan apa pun).
   ============================================================ */

/* ---------- panel admin (dipakai semua tema) ---------- */
html {
  --sk-panel-bg: #ffffff;
  --sk-panel-fg: #0f172a;
  --sk-panel-border: rgba(15, 23, 42, .10);
  --sk-panel-soft: #f1f5f9;
  --sk-panel-accent: #6366f1;
  --sk-panel-shadow: 0 26px 60px -20px rgba(15, 23, 42, .45);
}

.sk-admin-fab {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 330;
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  color: #fff;
  font-size: 22px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  box-shadow: 0 14px 30px -10px rgba(99, 102, 241, .75), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .18s ease, box-shadow .18s ease;
}
.sk-admin-fab:hover { transform: translateY(-3px) scale(1.03); }
.sk-admin-fab:active { transform: translateY(0) scale(.97); }

.sk-admin-panel {
  position: fixed;
  right: 16px;
  bottom: 80px;
  z-index: 331;
  width: min(372px, calc(100vw - 32px));
  max-height: min(78vh, 640px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  border-radius: 22px;
  background: var(--sk-panel-bg);
  color: var(--sk-panel-fg);
  border: 1px solid var(--sk-panel-border);
  box-shadow: var(--sk-panel-shadow);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  animation: skPanelIn .22s cubic-bezier(.2, .8, .2, 1);
}
@keyframes skPanelIn {
  from { opacity: 0; transform: translateY(10px) scale(.98); }
  to { opacity: 1; transform: none; }
}

.sk-admin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sk-admin-title { font-size: 15px; font-weight: 900; letter-spacing: -.01em; }
.sk-admin-sub { font-size: 11px; font-weight: 600; opacity: .6; margin-top: 3px; line-height: 1.4; }
.sk-admin-x {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--sk-panel-border);
  background: var(--sk-panel-soft); color: inherit; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
}

.sk-admin-search {
  width: 100%;
  height: 34px;
  margin-bottom: 10px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--sk-panel-border);
  background: var(--sk-panel-soft);
  color: inherit;
  font: inherit;
  font-size: 11.5px;
  font-weight: 700;
}
.sk-admin-search::placeholder { color: inherit; opacity: .45; }
.sk-admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sk-th {
  position: relative; display: flex; align-items: center; gap: 8px; text-align: left;
  padding: 8px; border-radius: 14px; border: 1px solid var(--sk-panel-border);
  background: var(--sk-panel-soft); color: inherit; font: inherit; cursor: pointer;
  transition: transform .15s ease, border-color .15s ease;
}
.sk-th:hover { transform: translateY(-1px); border-color: var(--sk-panel-accent); }
.sk-th.active { border-color: var(--sk-panel-accent); box-shadow: 0 0 0 2px var(--sk-panel-accent) inset; }
.sk-th-swatch { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.sk-th-meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sk-th-name { font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-th-desc { font-size: 9.5px; font-weight: 600; opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-th-check {
  position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 999px;
  background: var(--sk-panel-accent); color: #fff; font-size: 10px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
}

.sk-admin-sec { margin-top: 14px; }
.sk-admin-label { font-size: 10px; font-weight: 900; letter-spacing: .12em; opacity: .5; margin-bottom: 6px; }
.sk-admin-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 12px; background: var(--sk-panel-soft); }
.sk-mode {
  height: 34px; border-radius: 9px; border: none; cursor: pointer; font: inherit;
  font-size: 11.5px; font-weight: 800; color: inherit; background: transparent; opacity: .65;
}
.sk-mode.active { background: var(--sk-panel-accent); color: #fff; opacity: 1; }
.sk-admin-note {
  margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: var(--sk-panel-soft);
  font-size: 10.5px; font-weight: 600; line-height: 1.5; opacity: .85;
}
.sk-admin-note b { font-weight: 900; }

/* ============================================================
   1. DEFAULT — tampilan asli, tidak ada override
   ============================================================ */

/* ============================================================
   2. CLAYMORPHISM — empuk, pastel, seperti tanah liat
   ============================================================ */
html[data-skin="clay"] body { background: #e6ebf4 !important; }
html[data-skin="clay"] .sk-page {
  background: radial-gradient(130% 100% at 50% 0%, #f8fafd 0%, #e8edf6 45%, #dbe3f0 100%) !important;
  font-family: ui-rounded, "Nunito", "SF Pro Rounded", system-ui, -apple-system, sans-serif !important;
}
html[data-skin="clay"] .sk-panel {
  background: linear-gradient(160deg, #fbfcff, #eef2f9) !important;
  border: 1px solid rgba(255, 255, 255, .9) !important;
  box-shadow: 0 24px 48px -20px rgba(86, 110, 150, .55), 0 10px 22px -12px rgba(86, 110, 150, .35),
              inset 0 2px 0 rgba(255, 255, 255, .95), inset 0 -8px 16px rgba(148, 163, 190, .18) !important;
}
html[data-skin="clay"] .sk-surface {
  background: linear-gradient(160deg, #fdfeff, #f1f4fa) !important;
  border: 1px solid rgba(255, 255, 255, .85) !important;
  box-shadow: 0 14px 26px -16px rgba(86, 110, 150, .55), inset 0 1px 0 #fff,
              inset 0 -5px 12px rgba(148, 163, 190, .16) !important;
}
html[data-skin="clay"] .sk-chip {
  border: 1px solid rgba(255, 255, 255, .8) !important;
  box-shadow: 0 6px 12px -8px rgba(86, 110, 150, .65), inset 0 1px 0 rgba(255, 255, 255, .9) !important;
}
html[data-skin="clay"] .sk-tint { box-shadow: inset 0 2px 6px rgba(148, 163, 190, .28) !important; }
html[data-skin="clay"] .sk-field {
  background: #eef2f9 !important;
  border: 2px solid rgba(255, 255, 255, .9) !important;
  box-shadow: inset 4px 4px 10px rgba(163, 177, 198, .45), inset -4px -4px 10px rgba(255, 255, 255, .95) !important;
}
html[data-skin="clay"] .sk-btn {
  box-shadow: 0 7px 0 -3px rgba(255, 255, 255, .75), 0 12px 22px -12px rgba(86, 110, 150, .8),
              inset 0 -3px 6px rgba(0, 0, 0, .07) !important;
}
html[data-skin="clay"] .sk-btn:active { transform: translateY(3px); box-shadow: inset 0 -2px 6px rgba(0, 0, 0, .12) !important; }
html[data-skin="clay"] .sk-overlay { background: rgba(43, 50, 69, .35) !important; backdrop-filter: blur(6px); }

/* ============================================================
   3. GLASSMORPHISM — bening, blur, gradien lembut
   ============================================================ */
html[data-skin="glass"] body { background: #eef2ff !important; }
html[data-skin="glass"] .sk-page {
  background:
    radial-gradient(45% 35% at 12% 8%, rgba(167, 139, 250, .55), transparent 70%),
    radial-gradient(40% 35% at 90% 12%, rgba(103, 232, 249, .55), transparent 70%),
    radial-gradient(45% 40% at 75% 95%, rgba(251, 207, 232, .6), transparent 72%),
    radial-gradient(40% 35% at 20% 90%, rgba(191, 219, 254, .6), transparent 70%),
    #eef2ff !important;
  background-attachment: fixed !important;
}
html[data-skin="glass"] .sk-panel {
  background: linear-gradient(160deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .44)) !important;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, .78) !important;
  box-shadow: 0 24px 60px -24px rgba(30, 41, 59, .45), inset 0 1px 0 rgba(255, 255, 255, .9) !important;
}
html[data-skin="glass"] .sk-surface {
  background: rgba(255, 255, 255, .62) !important;
  border: 1px solid rgba(255, 255, 255, .7) !important;
  box-shadow: 0 10px 26px -18px rgba(30, 41, 59, .5), inset 0 1px 0 rgba(255, 255, 255, .85) !important;
}
html[data-skin="glass"] .sk-chip {
  border: 1px solid rgba(255, 255, 255, .72) !important;
  box-shadow: 0 4px 10px -6px rgba(30, 41, 59, .5) !important;
}
html[data-skin="glass"] .sk-tint { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55) !important; }
html[data-skin="glass"] .sk-field {
  background: rgba(255, 255, 255, .68) !important;
  border: 1px solid rgba(255, 255, 255, .9) !important;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 6px 16px -12px rgba(30, 41, 59, .6) !important;
}
html[data-skin="glass"] .sk-btn {
  box-shadow: 0 10px 24px -14px rgba(30, 41, 59, .75), inset 0 1px 0 rgba(255, 255, 255, .55) !important;
}
html[data-skin="glass"] .sk-overlay { background: rgba(15, 23, 42, .35) !important; backdrop-filter: blur(4px); }
html[data-skin="glass"] .sk-banner { background: rgba(255, 255, 255, .62) !important; border: 1px solid rgba(255, 255, 255, .8) !important; }

/* ============================================================
   4. NEONMORPHISM — gelap, garis neon, glow
   ============================================================ */
html[data-skin="neon"] {
  color-scheme: dark;
  --sk-panel-bg: #0b1020;
  --sk-panel-fg: #e7f2ff;
  --sk-panel-border: rgba(56, 189, 248, .3);
  --sk-panel-soft: rgba(148, 233, 255, .07);
  --sk-panel-accent: #22d3ee;
}
html[data-skin="neon"] body { background: #05070f !important; }
html[data-skin="neon"] .sk-page {
  background:
    radial-gradient(60% 40% at 10% 0%, rgba(34, 211, 238, .16), transparent 65%),
    radial-gradient(55% 45% at 95% 5%, rgba(168, 85, 247, .2), transparent 65%),
    radial-gradient(60% 50% at 50% 105%, rgba(59, 130, 246, .14), transparent 65%),
    #05070f !important;
  background-attachment: fixed !important;
}
html[data-skin="neon"] .sk-panel {
  background: linear-gradient(160deg, rgba(16, 22, 40, .95), rgba(8, 11, 22, .97)) !important;
  border: 1px solid rgba(56, 189, 248, .28) !important;
  box-shadow: 0 26px 60px -26px rgba(34, 211, 238, .65), inset 0 1px 0 rgba(148, 233, 255, .08) !important;
  color: #e7f2ff !important;
}
html[data-skin="neon"] .sk-surface {
  background: linear-gradient(160deg, rgba(18, 24, 44, .92), rgba(9, 12, 24, .94)) !important;
  border: 1px solid rgba(99, 102, 241, .25) !important;
  box-shadow: 0 0 18px -6px rgba(56, 189, 248, .4), inset 0 1px 0 rgba(148, 233, 255, .06) !important;
  color: #e7f2ff !important;
}
html[data-skin="neon"] .sk-chip {
  border: 1px solid rgba(255, 255, 255, .16) !important;
  box-shadow: 0 0 12px -3px rgba(56, 189, 248, .5) !important;
}
html[data-skin="neon"] .sk-tint {
  background: linear-gradient(120deg, rgba(34, 211, 238, .14), rgba(168, 85, 247, .14)) !important;
  border: 1px solid rgba(56, 189, 248, .16) !important;
}
html[data-skin="neon"] .sk-field {
  background: rgba(6, 10, 20, .92) !important;
  border: 1px solid rgba(56, 189, 248, .35) !important;

  box-shadow: inset 0 0 14px rgba(34, 211, 238, .12) !important;
}
html[data-skin="neon"] .sk-field::placeholder { color: rgba(190, 214, 255, .45) !important; }
html[data-skin="neon"] .sk-btn {
  box-shadow: 0 0 20px -6px rgba(56, 189, 248, .75), inset 0 1px 0 rgba(255, 255, 255, .12) !important;
}
html[data-skin="neon"] .sk-btn-dark { background: linear-gradient(135deg, #22d3ee, #a855f7) !important; color: #04101f !important; }
html[data-skin="neon"] .sk-txt { color: #e7f2ff !important; }
/* teks di dalam elemen yang tetap terang (tombol putih, chip, badge) jangan dipaksa terang */
html[data-skin="neon"] .sk-btn .sk-txt,
html[data-skin="neon"] .sk-btn .sk-txt-muted,
html[data-skin="neon"] .sk-chip .sk-txt,
html[data-skin="neon"] .sk-chip .sk-txt-muted,
html[data-skin="neon"] .sk-accent .sk-txt,
html[data-skin="neon"] .sk-accent .sk-txt-muted,
html[data-skin="neon"] .sk-banner .sk-txt,
html[data-skin="neon"] .sk-banner .sk-txt-muted,
html[data-skin="neon"] .sk-field .sk-txt { color: inherit !important; }
html[data-skin="neon"] .sk-txt-muted { color: rgba(190, 214, 255, .62) !important; }
html[data-skin="neon"] .sk-overlay { background: rgba(2, 4, 12, .72) !important; backdrop-filter: blur(8px); }
html[data-skin="neon"] .sk-btn-soft {
  background: rgba(148, 233, 255, .08) !important;
  color: rgba(206, 230, 255, .82) !important;
  border: 1px solid rgba(56, 189, 248, .22) !important;

}
html[data-skin="neon"] .sk-banner {
  background: #eef6ff !important;

}

/* ============================================================
   5. NEUMORPHISM — monokrom, timbul & tenggelam

/* ============================================================
   6. LEGOMORPHISM — balok mainan, garis tebal, bayangan keras
   ============================================================ */

/* ============================================================
   SKALA SUDUT (radius) per tema
   ============================================================ */
html[data-skin] .sk-pill { border-radius: 999px !important; }

html[data-skin="clay"] .sk-r-s { border-radius: 16px !important; }
html[data-skin="clay"] .sk-r-m { border-radius: 22px !important; }

html[data-skin="midnight"] body { background: #080b12 !important; }

  background:

html[data-skin="midnight"] .sk-overlay { background: rgba(3, 5, 9, .8) !important; backdrop-filter: blur(7px); }

}

html[data-skin="pixel"] .sk-btn-soft {

  border: 2px solid rgba(34, 197, 94, .5) !important;

/* ============================================================
   BUBBLE 3D — gelembung glossy warna-warni
   ============================================================ */
html[data-skin="bubble"] body { background: #eaf4ff !important; }
html[data-skin="bubble"] .sk-page {
  background:
    radial-gradient(28% 24% at 12% 8%, rgba(255, 179, 230, .6), transparent 70%),
    radial-gradient(26% 22% at 88% 10%, rgba(147, 197, 253, .6), transparent 70%),
    radial-gradient(28% 24% at 76% 92%, rgba(167, 243, 208, .55), transparent 70%),
    radial-gradient(24% 20% at 16% 88%, rgba(253, 230, 138, .55), transparent 70%),
    linear-gradient(160deg, #f5faff, #e9f2ff) !important;
  background-attachment: fixed !important;
  font-family: ui-rounded, "Nunito", "SF Pro Rounded", system-ui, sans-serif !important;
}
html[data-skin="bubble"] .sk-panel {
  background: linear-gradient(165deg, #ffffff 0%, #ffffff 55%, #f4f9ff 100%) !important;
  border: 1px solid #ffffff !important;
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, .98),
    inset 0 -12px 24px rgba(147, 197, 253, .26),
    0 14px 0 -11px rgba(147, 197, 253, .65),
    0 34px 56px -28px rgba(59, 130, 246, .5) !important;

  background: linear-gradient(160deg, #ffffff, #f6fbff) !important;
  border: 1px solid #ffffff !important;

}

}
html[data-skin="bubble"] .sk-tint {
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .95), inset 0 -8px 16px rgba(147, 197, 253, .3) !important;
}
html[data-skin="bubble"] .sk-banner {
  background: #ffffff !important;
  border: 1px solid #ffffff !important;
  box-shadow: 0 12px 26px -20px rgba(59, 130, 246, .85) !important;
}
html[data-skin="bubble"] .sk-field {

  box-shadow: inset 0 3px 8px rgba(147, 197, 253, .45), 0 1px 0 #fff !important;
}

html[data-skin="bubble"] .sk-overlay { background: rgba(30, 58, 138, .28) !important; backdrop-filter: blur(6px); }

   ============================================================ */

  background:

    radial-gradient(30% 26% at 70% 94%, rgba(251, 207, 232, .7), transparent 72%),

function scheduleToMin(v, fallbackMin) {
  if (typeof v === "string" && v.indexOf(":") !== -1) {
    const parts = v.split(":");
    const hh = parseInt(parts[0], 10), mm = parseInt(parts[1], 10);
    if (!isNaN(hh) && !isNaN(mm)) return Math.min(1439, Math.max(0, hh * 60 + mm));
  }
  const n = parseInt(v, 10);
  if (!isNaN(n)) {
    if (n >= 0 && n <= 23) return n * 60;
    return Math.min(1439, Math.max(0, n));
  }
  return fallbackMin;
}
function fmtSchedule(min) {
  const m = Math.min(1439, Math.max(0, min | 0));
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}
function parseTimeInput(str) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(str || "").trim());
  if (!m) return null;
  const h = parseInt(m[1], 10), mm = parseInt(m[2], 10);
  if (h > 23 || mm > 59) return null;
  return h * 60 + mm;
}

async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch { return false; }
}

    hour: parseInt(parts.hour, 10),

function weekRangesInMonth(year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const ranges = [];
  const bounds = [[1,7],[8,14],[15,21],[22, daysInMonth]];
  bounds.forEach((b, idx) => {
    if (b[0] > daysInMonth) return;
    const end = Math.min(b[1], daysInMonth);
    const s = `${year}-${String(month+1).padStart(2,"0")}-${String(b[0]).padStart(2,"0")}`;
    const e = `${year}-${String(month+1).padStart(2,"0")}-${String(end).padStart(2,"0")}`;
    ranges.push({ week: idx + 1, start: s, end: e });
  });
  return ranges;
}
function eachDateStr(startStr, endStr) {
  const out = [];
  const [ys,ms,ds] = startStr.split("-").map(Number);
  const [ye,me,de] = endStr.split("-").map(Number);
  let cur = new Date(ys, ms-1, ds);
  const end = new Date(ye, me-1, de);
  while (cur <= end) {
    out.push(toInputDate(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

  const markDirty = (name) => {

  const markDirtyMany = (names) => {
    names.forEach(n => dirtyRef.current.add(n));
  };
  const markDirtyDiff = (beforeAtt, afterAtt, beforeReas, afterReas) => {
    const names = new Set([
      ...Object.keys(beforeAtt || {}),
      ...Object.keys(afterAtt || {})
    ]);
    names.forEach(n => {
      const a1 = normalizeStatus(beforeAtt?.[n]) || null;
      const a2 = normalizeStatus(afterAtt?.[n]) || null;
      const r1 = beforeReas?.[n] || "";
      const r2 = afterReas?.[n] || "";
      if (a1 !== a2 || r1 !== r2) dirtyRef.current.add(n);
    });
  };

  const doUndo = () => {
    if (!undoStack.length) { toast("⚠️ Tidak ada yang bisa di-undo"); return; }
    const target = undoStack[undoStack.length - 1];
    const current = snapshotNow();
    setUndoStack(s => s.slice(0, -1));
    setRedoStack(s => [...s, current]);
    markDirtyDiff(current.attendance, target.attendance, current.izinReasons, target.izinReasons);
    setAttendance(target.attendance);
    setIzinReasons(target.izinReasons);
    toast("↶ Undo");
  };

  const doRedo = () => {
    if (!redoStack.length) { toast("⚠️ Tidak ada yang bisa di-redo"); return; }
    const target = redoStack[redoStack.length - 1];
    const current = snapshotNow();
    setRedoStack(s => s.slice(0, -1));
    setUndoStack(s => [...s, current]);
    markDirtyDiff(current.attendance, target.attendance, current.izinReasons, target.izinReasons);

  const dateStr = toInputDate(date);

  // Siswa selalu di tanggal hari ini

    const onO = refO.on("value", snap => {
      const v = snap.val();
      if (v === null || v === undefined) {
        refO.set(DEFAULT_AUTO_OPEN_MIN);
        setAutoOpenMin(DEFAULT_AUTO_OPEN_MIN);
        setAutoOpenMinDraft(fmtSchedule(DEFAULT_AUTO_OPEN_MIN));
      } else {
        const m = scheduleToMin(v, DEFAULT_AUTO_OPEN_MIN);
        setAutoOpenMin(m);
        setAutoOpenMinDraft(fmtSchedule(m));
        if (typeof v === "number" && v >= 0 && v <= 23) refO.set(m);
      }
    });
    const onH = refH.on("value", snap => {
      const v = snap.val();
      if (v === null || v === undefined) {
        refH.set(DEFAULT_AUTO_RESET_MIN);
        setAutoResetMin(DEFAULT_AUTO_RESET_MIN);
        setAutoResetMinDraft(fmtSchedule(DEFAULT_AUTO_RESET_MIN));
      } else {
        const m = scheduleToMin(v, DEFAULT_AUTO_RESET_MIN);
        setAutoResetMin(m);
        setAutoResetMinDraft(fmtSchedule(m));
        if (typeof v === "number" && v >= 0 && v <= 23) refH.set(m);
      }
    });
    const onE = refE.on("value", snap => {
      const v = snap.val();
      if (v === null || v === undefined) {
        refE.set(true);
        setAutoResetEnabled(true);
      } else {
        setAutoResetEnabled(v === true || v === "true" || v === 1);
      }
    });
    return () => {
      refO.off("value", onO);
      refH.off("value", onH);
      refE.off("value", onE);

  }, []);

  // Pergantian hari (00:00 WIB)
  useEffect(() => {

      lastWibDateRef.current = getWibParts().dateStr;

    const checkNewDay = () => {

      if (lastWibDateRef.current === today) return;
      lastWibDateRef.current = today;
      setDate(new Date());
      toast("🌅 Hari baru (" + today + ")");

    checkNewDay();
    const id = setInterval(checkNewDay, 30000);
    return () => clearInterval(id);
  }, []);

  // Reset undo/redo & dirty saat ganti tanggal atau program

    setRedoStack([]);

  }, [dateStr, batch]);

  // Shortcut keyboard Ctrl+Z / Ctrl+Shift+Z untuk undo/redo
  useEffect(() => {
    if (!isAdmin) return;
    const handler = (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (String(e.key).toLowerCase() !== "z") return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      e.preventDefault();
      if (e.shiftKey) doRedo(); else doUndo();
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [isAdmin, undoStack, redoStack, attendance, izinReasons]);

// Cegah keluar saat masih ada perubahan belum tersimpan
useEffect(() => {
  const handler = (e) => {
    const pending = (saveStatus === "saving") || syncing;
    if (pending) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  };
  window.addEventListener("beforeunload", handler);
  return () => window.removeEventListener("beforeunload", handler);
}, [saveStatus, syncing]);

// Reminder 10 menit sebelum jam tutup
useEffect(() => {
  if (!autoResetEnabled) { setReminderActive(false); return; }
  const check = () => {
    const wib = getWibParts();
    const now = wib.hour * 60 + wib.minute;
    let diff = autoResetMin - now;
    if (diff < -720) diff += 1440;
    if (diff > 720) diff -= 1440;
    setReminderActive(diff > 0 && diff <= 10);
  };
  check();
  const id = setInterval(check, 30000);
  return () => clearInterval(id);
}, [autoResetEnabled, autoResetMin]);

// Kedip-kedip background saat reminder aktif
useEffect(() => {
  if (!reminderActive) { setFlashOn(false); return; }
  const id = setInterval(() => setFlashOn(v => !v), 900);
  return () => clearInterval(id);
}, [reminderActive]);

  // Jam tutup: yang belum absen → ALFA
  useEffect(() => {
    const fillAlfaAtClose = async () => {
      if (autoResetRunning.current) return;
      if (!navigator.onLine) return;
      if (!autoResetEnabled) return;
      try {
        const wib = getWibParts();
        if (wib.hour * 60 + wib.minute < autoResetMin) return;
        const today = wib.dateStr;
        const snap = await db.ref(metaLastAlfaFillPath()).once("value");
        if (snap.val() === today) return;

        autoResetRunning.current = true;
        let totalFilled = 0;

        for (const b of BATCH_LIST) {
          const namesSnap = await db.ref(studentsPath(b)).once("value");
          let names = namesSnap.val();
          if (!Array.isArray(names) || !names.length) {
            names = BATCH_STUDENTS[b] || [];
          }
          names = names.map(n => String(n).trim()).filter(Boolean);

          const attPath = attendancePath(b, today);
          const attSnap = await db.ref(attPath).once("value");
          const existing = attSnap.val() || {};
          const updates = {};
          let changed = false;

          // Normalisasi key yang sudah ada (kalau ada versi unicode-escaped)
          const existingByRealName = {};
          Object.keys(existing).forEach(k => {
            const name = fromFbKey(k);
            const item = existing[k];
            const st = item && typeof item === "object" ? normalizeStatus(item.status) : normalizeStatus(item);
            if (st) {
              existingByRealName[name] = (item && typeof item === "object")
                ? { status: st, reason: item.reason || "" }
                : { status: st, reason: "" };
              // pastikan key tersimpan dalam bentuk toFbKey
              if (k !== toFbKey(name)) {
                updates[toFbKey(name)] = existingByRealName[name];
                updates[k] = null;
                changed = true;
              }
            }
          });

          names.forEach(n => {
            if (!existingByRealName[n]) {
              updates[toFbKey(n)] = { status: "ALFA", reason: "" };
              changed = true;
              totalFilled++;
            }
          });

          if (changed && Object.keys(updates).length) {
            await db.ref(attPath).update(updates);
          }
        }

        await db.ref(metaLastAlfaFillPath()).set(today);

        if (dateStr === today) {
          skipNextSave.current = true;
          setAttendance(prev => {
            const n = { ...prev };
            students.forEach(s => { if (!n[s]) n[s] = "ALFA"; });
            return n;
          });
          setTimeout(() => { skipNextSave.current = false; }, 300);
        }

        if (totalFilled > 0) {
          toast("✅ Jam tutup — " + totalFilled + " yang belum absen ditandai ALFA");
        } else {
          toast("✅ Jam tutup — semua sudah punya status");
        }
        autoResetRunning.current = false;
      } catch (err) {
        console.warn("auto alfa fill failed", err);
        autoResetRunning.current = false;
      }
    };
    fillAlfaAtClose();
    const id = setInterval(fillAlfaAtClose, 60000);
    return () => clearInterval(id);
  }, [autoResetMin, autoResetEnabled, dateStr, students]);

  const saveAutoResetSettings = async () => {
    const openM = parseTimeInput(autoOpenMinDraft);

    if (openM === null || closeM === null) {
      toast("⚠️ Format jam tidak valid");
      return;
    }
    if (openM === closeM) {
      toast("⚠️ Jam buka dan tutup tidak boleh sama");
      return;
    }
    try {
      await db.ref(metaAutoOpenHourPath()).set(openM);
      await db.ref(metaAutoResetHourPath()).set(closeM);
      await db.ref(metaAutoResetEnabledPath()).set(!!autoResetEnabled);

        saveGendersLocal(batch, cleaned);

    const ref = db.ref(path);
    ref.once("value").then(snap => {
      const val = snap.val() || {};
      const att = {};
      const reasons = {};
      Object.keys(val).forEach(rawKey => {
        const name = fromFbKey(rawKey);
        const item = val[rawKey];
        if (item && typeof item === "object") {
          att[name] = normalizeStatus(item.status);
          reasons[name] = item.reason || "";
        } else if (typeof item === "string") {
          att[name] = normalizeStatus(item);
          reasons[name] = "";

      });
      const nextAtt = {};
      const nextReas = {};
      students.forEach(n => {
        nextAtt[n] = att[n] !== undefined ? normalizeStatus(att[n]) : null;
        nextReas[n] = reasons[n] !== undefined ? reasons[n] : "";
      });
      setAttendance(nextAtt);
      setIzinReasons(nextReas);
      setLoadingFb(false);
      dirtyRef.current.clear();
      setTimeout(() => { skipNextSave.current = false; }, 120);
    }).catch(err => {
      console.warn("Firebase attendance load failed", err);
      const empty = {};
      const emptyR = {};
      students.forEach(n => { empty[n] = null; emptyR[n] = ""; });
      setAttendance(empty);
      setIzinReasons(emptyR);
      setLoadingFb(false);
      dirtyRef.current.clear();
      setTimeout(() => { skipNextSave.current = false; }, 120);
      toast("⚠️ Gagal load absensi — mode offline");

  // Save students
  useEffect(() => {

  useEffect(() => {

  useEffect(() => {

    let cancelled = false;
    Promise.all(dates.map(ds =>
      db.ref(attendancePath(batch, ds)).once("value").then(snap => {
        const val = snap.val() || {};
        const map = {};
        Object.keys(val).forEach(rawKey => {
          const name = fromFbKey(rawKey);
          const item = val[rawKey];
          if (item && typeof item === "object") map[name] = normalizeStatus(item.status);
          else if (typeof item === "string") map[name] = normalizeStatus(item);
        });
        if (ds === dateStr) {
          students.forEach(n => {
            if (attendance[n]) map[n] = attendance[n];
            else if (map[n] === undefined) map[n] = null;
          });
        }
        return [ds, map];
      }).catch(() => [ds, {}])
    )).then(pairs => {
      if (cancelled) return;
      const next = {};
      pairs.forEach(([ds, map]) => { next[ds] = map; });
      setHistoryMap(next);
    });
    return () => { cancelled = true; };
  }, [batch, dateStr, students]);

  useEffect(() => {
    if (loadingFb) return;
    setHistoryMap(prev => {
      const day = { ...(prev[dateStr] || {}) };

        day[n] = attendance[n] || null;

      return { ...prev, [dateStr]: day };

  // ===================== FIX A: SAVE HANYA SISWA YANG DIUBAH (update per-key) =====================
  useEffect(() => {
    if (loadingFb || skipNextSave.current) return;
    if (studentsLoadedFor.current !== batch) return;
    if (!dirtyRef.current.size) return;

    // Ambil snapshot dirty lalu langsung clear, biar kalau ada perubahan baru
    // selama request, dia masuk ke antrian berikutnya.
    const dirtyNames = Array.from(dirtyRef.current);
    dirtyRef.current.clear();

    setSyncing(true);
    setSaveStatus("saving");

    const updates = {};
    dirtyNames.forEach(name => {
      const key = toFbKey(name);
      const st = normalizeStatus(attendance[name]);
      if (st) {
        updates[key] = {
          status: st,
          reason: st === "IZIN" ? (izinReasons[name] || "") : ""
        };
      } else {
        updates[key] = null;  // null = hapus key di Firebase (bukan sentuh key lain)
      }
    });

    if (!Object.keys(updates).length) {
      setSyncing(false);
      setSaveStatus("saved");
      return;
    }

    const path = attendancePath(batch, dateStr);
    db.ref(path).update(updates).then(() => {
      setSyncing(false);
      setSaveStatus("saved");
      setLastSavedAt(new Date());
    }).catch(err => {
      console.warn("save attendance failed", err);
      setSyncing(false);
      setSaveStatus("error");
      toast("⚠️ Gagal simpan ke Firebase");
    });
  }, [attendance, izinReasons, dateStr, students, loadingFb, batch]);

  /* ===== SEARCH: hasil filter + auto-scroll ===== */
  const searchResults = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    if (!q || !allStudentsCache) return [];
    const out = [];
    BATCH_LIST.forEach(b => {
      (allStudentsCache[b] || []).forEach(name => {
        if (name.toLowerCase().includes(q)) {
          out.push({ name, batch: b, label: (BATCH_THEME[b] && BATCH_THEME[b].label) || b });
        }
      });
    });
    return out.slice(0, 80);
  }, [searchQuery, allStudentsCache]);

  useEffect(() => {
    if (!pendingScrollTo) return;
    if (loadingFb) return;
    if (studentsLoadedFor.current !== batch) return;
    const name = pendingScrollTo;
    if (!students.includes(name)) {
      toast("⚠️ Nama tidak ditemukan di " + batchLabel);
      setPendingScrollTo(null);
      return;
    }
    const t = setTimeout(() => {
      const el = document.querySelector(`[data-student-name="${CSS.escape(name)}"]`);
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.style.transition = "outline .3s, box-shadow .3s";
        el.style.outline = "3px solid #000000";
el.style.boxShadow = "0 0 0 8px rgba(0,0,0,.18)";
        setTimeout(() => {
          el.style.outline = "";
          el.style.boxShadow = "0 8px 30px rgba(0,0,0,.04)";
        }, 2600);
      }
      setPendingScrollTo(null);
    }, 350);
    return () => clearTimeout(t);

const doRename = async () => {
  if (!renameTarget) return;
  const oldName = renameTarget;
  const newName = renameValue.trim().toUpperCase();
  if (!newName) { toast("⚠️ Nama tidak boleh kosong"); return; }
  if (newName === oldName) { setRenameTarget(null); return; }
  if (students.some(s => s.toLowerCase() === newName.toLowerCase())) {
    toast("⚠️ Nama \"" + newName + "\" sudah dipakai");
    return;
  }
  setRenameSaving(true);
  try {
    // 1. Update array students
    const next = students.map(s => s === oldName ? newName : s).sort((a,b)=>a.localeCompare(b,"id"));
    await db.ref(studentsPath(batch)).set(next);
    setStudents(next);

    // 2. Rename key di SEMUA attendance (scan sekali)
    const attSnap = await db.ref(`${FB_ROOT}/batch_${batch}/attendance`).once("value");
    const all = attSnap.val() || {};
    const oldKey = toFbKey(oldName);
    const newKey = toFbKey(newName);
    const updates = {};
    let moved = 0;
    Object.keys(all).forEach(dateKey => {
      const day = all[dateKey];
      if (!day || typeof day !== "object") return;
      Object.keys(day).forEach(actKey => {
        const act = day[actKey];
        if (!act || typeof act !== "object") return;
        if (act[oldKey] !== undefined) {
          updates[`${FB_ROOT}/batch_${batch}/attendance/${dateKey}/${actKey}/${newKey}`] = act[oldKey];
          updates[`${FB_ROOT}/batch_${batch}/attendance/${dateKey}/${actKey}/${oldKey}`] = null;
          moved++;
        }
      });
    });
    if (Object.keys(updates).length) {
      await db.ref().update(updates);
    }

    // 3. Update state lokal (attendance/izinReasons/historyMap)
    setAttendance(prev => {
      if (prev[oldName] === undefined) return prev;
      const n = { ...prev };
      n[newName] = n[oldName];
      delete n[oldName];
      return n;
    });
    setIzinReasons(prev => {
      if (prev[oldName] === undefined) return prev;
      const n = { ...prev };
      n[newName] = n[oldName];
      delete n[oldName];
      return n;
    });
    setHistoryMap(prev => {
      const out = {};
      Object.keys(prev).forEach(ds => {
        const day = { ...prev[ds] };
        if (day[oldName] !== undefined) {
          day[newName] = day[oldName];
          delete day[oldName];
        }
        out[ds] = day;
      });
      return out;
    });

    // Pindah gender
    setGenders(prev => {
      if (prev[oldName] === undefined) return prev;
      const n = { ...prev };
      n[newName] = n[oldName];
      delete n[oldName];
      return n;
    });
    try {
      const gUpdates = {};
      gUpdates[toFbKey(newName)] = genders[oldName] || null;
      gUpdates[toFbKey(oldName)] = null;
      await db.ref(gendersPath(batch)).update(gUpdates);
    } catch {}

    toast("✅ " + oldName + " → " + newName + " (" + moved + " data dipindah)");
    setRenameTarget(null);
  } catch (err) {
    console.warn("rename failed", err);
    toast("⚠️ Gagal rename — cek koneksi");
  }
  setRenameSaving(false);
};

const addEditRow = () => {
  setEditRows(prev => {
    const existing = prev.map(r => r.date).filter(Boolean).sort();
    let nextDate = dateStr;
    if (existing.length) {
      const earliest = existing[0];
      const [y, m, d] = earliest.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      // Mundur 1 hari, kalau masih bentrok, mundur terus
      do {
        dt.setDate(dt.getDate() - 1);
        nextDate = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
      } while (existing.includes(nextDate) && (dt.getTime() > Date.now() - 1000*60*60*24*365));
    }
    return [...prev, { date: nextDate, status: "", reason: "" }];
  });
};

  if (!editStudent) return;
  const valid = editRows.filter(r => r.date);
  if (!valid.length) { toast("⚠️ Isi minimal 1 baris"); return; }

  const byDate = {};
  valid.forEach(r => { byDate[r.date] = r; });

  setEditSaving(true);
  try {
    for (const ds of Object.keys(byDate)) {
      const r = byDate[ds];
      const path = attendancePath(batch, ds);
      const snap = await db.ref(path).once("value");
      const val = snap.val() || {};
      // Bangun update per-key supaya tidak menimpa siswa lain.
      const updates = {};
      const k = toFbKey(editStudent);
      if (!r.status) {
        updates[k] = null;
        if (editStudent !== k && val[editStudent] !== undefined) updates[editStudent] = null;
      } else {
        updates[k] = {
          status: r.status,

const buildRekapTextFor = async (batchKey, dateList) => {
  const names = await getStudentsForBatch(batchKey);
  if (!names.length) return null;

  const th = BATCH_THEME[batchKey] || {};
  const label = th.label || batchKey;

  const attMap = {};
  names.forEach(n => { attMap[n] = {}; });
  await Promise.all(dateList.map(async ds => {
    try {
      const snap = await db.ref(attendancePath(batchKey, ds)).once("value");
      const val = snap.val() || {};
      names.forEach(n => {
        const item = val[toFbKey(n)] !== undefined ? val[toFbKey(n)] : val[n];
        let st = null;
        if (item && typeof item === "object") st = normalizeStatus(item.status);
        else if (typeof item === "string") st = normalizeStatus(item);
        if (batchKey === batch && ds === dateStr && attendance[n]) st = normalizeStatus(attendance[n]);
        attMap[n][ds] = st;
      });
    } catch {
      names.forEach(n => { attMap[n][ds] = attMap[n][ds] || null; });
    }
  }));

  const [y0, m0, day0] = dateList[0].split("-").map(Number);
  const [yN, mN, dayN] = dateList[dateList.length - 1].split("-").map(Number);
  let dateLabel;
  if (y0 === yN && m0 === mN) dateLabel = `${day0}-${dayN}`;
  else if (y0 === yN) dateLabel = `${day0} ${MONTH_NAMES_RK[m0-1]} - ${dayN} ${MONTH_NAMES_RK[mN-1]}`;
  else dateLabel = `${day0}/${m0}/${y0} - ${dayN}/${mN}/${yN}`;

  let t = `Rekapan (${label})\n`;
  t += `Tanggal: ${dateLabel}\n`;
  names.forEach((name, i) => {
    const emojis = dateList.map(ds => {
      const st = attMap[name][ds];
      if (st === "HADIR") return "✅";
      if (st === "SAKIT") return "🆘";
      if (st === "IZIN") return "ℹ️";
      if (st === "ALFA") return "❌";
      return "⬜";
    }).join("");
    t += `${i + 1}. ${name} ${emojis}\n`;
  });
  t += `\n✅ Hadir · 🆘 Sakit · ℹ️ Izin · ❌ Alfa · ⬜ Belum`;
  return t;
};

      for (let i = 6; i >= 0; i--) dateList.push(dateOffsetStr(today, -i));

      for (let i = 13; i >= 0; i--) dateList.push(dateOffsetStr(today, -i));

      const daysInMonth = new Date(salinRekapYear, salinRekapMonth + 1, 0).getDate();
      const s = `${salinRekapYear}-${String(salinRekapMonth+1).padStart(2,"0")}-01`;
      const e = `${salinRekapYear}-${String(salinRekapMonth+1).padStart(2,"0")}-${String(daysInMonth).padStart(2,"0")}`;
      dateList = eachDateStr(s, e);
    } else {
      if (!salinRekapStart || !salinRekapEnd) { toast("⚠️ Pilih tanggal mulai dan akhir"); setSalinRekapBusy(false); return; }
      if (salinRekapStart > salinRekapEnd) { toast("⚠️ Tanggal mulai harus sebelum akhir"); setSalinRekapBusy(false); return; }
      dateList = eachDateStr(salinRekapStart, salinRekapEnd);
    }

    if (!dateList.length) { toast("⚠️ Tidak ada tanggal"); setSalinRekapBusy(false); return; }

    const selectedKeys = Object.keys(salinRekapSelected).filter(k => salinRekapSelected[k]);
    if (!selectedKeys.length) { toast("⚠️ Pilih minimal 1 batch dulu"); setSalinRekapBusy(false); return; }

    const blocks = [];
    for (const k of selectedKeys) {
      try {
        const b = await buildRekapTextFor(k, dateList);
        if (b) blocks.push(b);
      } catch (err) { console.warn("salin rekap batch " + k + " gagal", err); }
    }
    if (!blocks.length) { toast("⚠️ Tidak ada data"); setSalinRekapBusy(false); return; }

    const text = blocks.join("\n\n━━━━━━━━━━━━━━━\n\n");
    setPreviewText(text);
    setShowSalinRekapMenu(false);
    setShowPreview(true);
    setTimeout(() => { if (taRef.current) { taRef.current.focus(); taRef.current.select(); } }, 120);
    const ok = await copyText(text);
    toast(ok ? "✅ Rekap disalin (" + blocks.length + " batch)!" : "⚠️ Teks siap — klik Kirim untuk WA");
  } catch (err) {
    console.warn("salin rekap error", err);
    toast("⚠️ Gagal menyusun rekap");

  setSalinRekapBusy(false);
};

/* ===================== PEMILIH TEMA + ATUR SENDIRI (KHUSUS ADMIN) ===================== */
function ThemeLauncher({ isAdmin }) {
  const [open, setOpen] = useState(false);
  const [info, setInfo] = useState(() => SkinEngine.getState());
  const [q, setQ] = useState("");

  useEffect(() => SkinEngine.subscribe(setInfo), []);

  if (!isAdmin) return null;

  const cfg = info.cfg;
  const cu = info.custom || SkinEngine.DEFAULT_CUSTOM;
  const isDaily = cfg.mode === "daily";
  const isCustom = cfg.skin === "custom";
  const byId = id => SkinEngine.THEMES.filter(t => t.id === id)[0] || SkinEngine.THEMES[0];
  const todayTheme = byId(info.today);
  const tomorrowTheme = byId(info.tomorrow);
  const activeTheme = byId(cfg.skin);
  const needle = q.trim().toLowerCase();
  const setCu = patch => SkinEngine.updateCustom(patch);

  const card = t => {
    const active = t.id === cfg.skin && !isDaily;
    const isToday = isDaily && t.id === info.today;
    return h("button", {
      key: t.id,
      className: "sk-th" + (active ? " active" : ""),
      onClick: () => SkinEngine.update({ skin: t.id, mode: "fixed" }),
      title: t.name
    }, [
      h("span", { key: "s", className: "sk-th-swatch", style: { background: t.preview } }),
      h("span", { key: "m", className: "sk-th-meta" }, [
        h("span", { key: "n", className: "sk-th-name" }, t.name),
        h("span", { key: "d", className: "sk-th-desc" }, isToday ? "hari ini" : t.desc)
      ]),
      active && h("span", { key: "c", className: "sk-th-check" }, "✓"),
      !active && isToday && h("span", { key: "t", className: "sk-th-check" }, "★")
    ]);
  };

  const group = (label, items) => {
    const shown = needle ? items.filter(t => (t.name + " " + t.desc).toLowerCase().indexOf(needle) >= 0) : items;
    if (!shown.length) return null;
    return h("div", { key: label }, [
      h("div", { key: "l", className: "sk-admin-label", style: { marginTop: 12 } }, label + " · " + items.length),
      h("div", { key: "g", className: "sk-admin-grid" }, shown.map(card))
    ]);
  };

  /* ---------- kontrol atur sendiri ---------- */
  const colorRow = (label, key, value, k) => h("div", { key: "c-" + k, className: "sk-ctl-row" }, [
    h("span", { key: "l", className: "sk-ctl-label" }, label),
    h("span", { key: "w", className: "sk-ctl-colors" }, [
      h("input", {
        key: "i", type: "color", className: "sk-color", value: value,
        onChange: e => setCu({ [key]: e.target.value })
      }),
      h("span", { key: "h", className: "sk-hex" }, String(value || "").toUpperCase())
    ])
  ]);

  const selectRow = (label, key, value, opts, k) => h("div", { key: "s-" + k, className: "sk-ctl" }, [
    h("span", { key: "l", className: "sk-ctl-label" }, label),
    h("select", {
      key: "i", className: "sk-select", value: value,
      onChange: e => setCu({ [key]: e.target.value })
    }, opts.map(o => h("option", { key: o[0], value: o[0] }, o[1])))
  ]);

  const rangeRow = (label, key, value, min, max, step, suffix, k) => h("div", { key: "r-" + k, className: "sk-ctl" }, [
    h("div", { key: "h", className: "sk-ctl-row" }, [
      h("span", { key: "l", className: "sk-ctl-label" }, label),
      h("span", { key: "v", className: "sk-ctl-val" }, value + (suffix || ""))
    ]),
    h("input", {
      key: "i", type: "range", className: "sk-range", min: min, max: max, step: step, value: value,
      onChange: e => setCu({ [key]: Number(e.target.value) })
    })
  ]);

  const toggleRow = (label, key, value, k) => h("label", { key: "t-" + k, className: "sk-ctl-row sk-ctl-toggle" }, [
    h("span", { key: "l", className: "sk-ctl-label" }, label),
    h("input", {
      key: "i", type: "checkbox", checked: !!value,
      onChange: e => setCu({ [key]: e.target.checked })
    })
  ]);

  const settings = isCustom && h("div", { key: "custom", className: "sk-settings" }, [
    h("div", { key: "l", className: "sk-admin-label" }, "PRESET CEPAT"),
    h("div", { key: "p", className: "sk-presets" }, SkinEngine.PRESETS.map(p =>
      h("button", { key: p.id, className: "sk-preset", onClick: () => setCu(p.values) }, p.name)
    )),

    h("div", { key: "l2", className: "sk-admin-label", style: { marginTop: 14 } }, "LATAR HALAMAN"),
    selectRow("Gaya latar", "bgStyle", cu.bgStyle, [
      ["solid", "Warna rata"], ["gradient", "Gradien"], ["grid", "Garis grid"], ["dots", "Titik-titik"], ["mesh", "Cahaya mesh"]
    ], "bgStyle"),
    colorRow("Warna latar", "bg", cu.bg, "bg"),
    colorRow("Warna kedua", "bg2", cu.bg2, "bg2"),

    h("div", { key: "l3", className: "sk-admin-label", style: { marginTop: 14 } }, "KARTU & GARIS"),
    colorRow("Warna kartu", "surface", cu.surface, "surface"),
    rangeRow("Transparansi kartu", "surfaceAlpha", Math.round((cu.surfaceAlpha || 1) * 100), 35, 100, 1, "%", "surfaceAlpha"),
    colorRow("Warna garis tepi", "border", cu.border, "border"),
    rangeRow("Tebal garis tepi", "borderWidth", cu.borderWidth, 0, 6, 1, "px", "borderWidth"),
    rangeRow("Sudut membulat", "radius", cu.radius, 0, 44, 1, "px", "radius"),
    selectRow("Jenis bayangan", "shadow", cu.shadow, [
      ["none", "Tanpa bayangan"], ["soft", "Lembut"], ["strong", "Tebal & dalam"],
      ["hard", "Kotak keras (lego)"], ["glow", "Menyala (neon)"], ["float", "3D timbul"]
    ], "shadow"),
    toggleRow("Efek kaca (blur)", "glass", cu.glass, "glass"),

    h("div", { key: "l4", className: "sk-admin-label", style: { marginTop: 14 } }, "TEKS"),
    colorRow("Warna teks", "text", cu.text, "text"),
    colorRow("Teks sekunder", "textDim", cu.textDim, "textDim"),
    selectRow("Jenis huruf", "font", cu.font, [
      ["system", "Biasa (system)"], ["rounded", "Membulat"], ["serif", "Serif"],
      ["mono", "Monospace"], ["narrow", "Ramping"]
    ], "font"),
    rangeRow("Ukuran tampilan", "zoom", cu.zoom, 85, 115, 1, "%", "zoom"),

    h("div", { key: "l5", className: "sk-admin-label", style: { marginTop: 14 } }, "TOMBOL & AKSEN"),
    colorRow("Warna aksen", "accent", cu.accent, "accent"),
    colorRow("Teks di aksen", "accentText", cu.accentText, "accentText"),
    selectRow("Warna tombol", "buttonStyle", cu.buttonStyle, [
      ["auto", "Warna asli aplikasi (HADIR hijau, dll)"], ["accent", "Semua tombol warna aksen"]
    ], "buttonStyle"),

    h("button", {
      key: "reset",
      className: "sk-preset sk-preset-reset",
      onClick: () => setCu(SkinEngine.DEFAULT_CUSTOM)
    }, "↺ Reset ke pengaturan awal")
  ]);

  const lights = SkinEngine.THEMES.filter(t => t.tone !== "dark");
  const darks = SkinEngine.THEMES.filter(t => t.tone === "dark");

  return h("div", null, [
    h("button", {
      key: "fab",
      className: "sk-admin-fab",
      onClick: () => setOpen(o => !o),
      title: "Pilih tema tampilan",
      "aria-label": "Pilih tema tampilan"
    }, open ? "✕" : "🎨"),

    open && h("div", { key: "panel", className: "sk-admin-panel" }, [
      h("div", { key: "head", className: "sk-admin-head" }, [
        h("div", null, [
          h("div", { className: "sk-admin-title" }, "🎨 Tema Tampilan"),
          h("div", { className: "sk-admin-sub" }, (SkinEngine.THEMES.length) + " tema · pilihan admin langsung diikuti semua siswa")
        ]),
        h("button", { className: "sk-admin-x", onClick: () => setOpen(false), title: "Tutup" }, "✕")
      ]),

      h("input", {
        key: "search",
        type: "text",
        value: q,
        onChange: e => setQ(e.target.value),
        placeholder: "Cari tema...",
        className: "sk-admin-search"
      }),

      group("TEMA TERANG", lights),
      group("TEMA GELAP", darks),

      h("div", { key: "mode", className: "sk-admin-sec" }, [
        h("div", { className: "sk-admin-label" }, "MODE TEMA"),
        h("div", { className: "sk-admin-modes" }, [
          h("button", {
            className: "sk-mode" + (!isDaily ? " active" : ""),
            onClick: () => SkinEngine.update({ mode: "fixed" })
          }, "📌 Manual"),
          h("button", {
            className: "sk-mode" + (isDaily ? " active" : ""),
            onClick: () => SkinEngine.update({ mode: "daily" })
          }, "🎲 Acak harian")
        ])
      ]),

      settings,

      h("div", { key: "note", className: "sk-admin-note" },
        isDaily
          ? [
              "Tema otomatis berganti tiap hari dari tanggal (WIB), jadi semua HP menampilkan tema yang sama.",
              h("br", { key: "b1" }),
              h("br", { key: "b2" }),
              "Hari ini: ",
              h("b", { key: "t" }, todayTheme.name),
              h("br", { key: "b3" }),
              "Besok: ",
              h("b", { key: "tm" }, tomorrowTheme.name)
            ]
          : isCustom
            ? [
                "Mode ", h("b", { key: "c" }, "Custom Bebas"), " aktif. Semua warna, bentuk dan bayangan di bawah ini ",
                "langsung tersimpan dan dipakai tampilan siswa."
              ]
            : [
                "Tema aktif: ",
                h("b", { key: "t" }, activeTheme.name),
                ". Tampilan siswa mengikuti otomatis begitu tersimpan."
              ]
      )
    ])
  ]);
}

/* ===== KONEKSI TEMA: admin menyimpan, siswa mengikuti ===== */
SkinEngine.connect(db, () => FB_ROOT + "/meta/ui_theme", "skin_absensi_v1");

ReactDOM.createRoot(document.getElementById("root")).render(h(AbsensiApp));
</script>

</body>
</html>
